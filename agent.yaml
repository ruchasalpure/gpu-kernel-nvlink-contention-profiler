spec_version: "0.1.0"
name: gpu-kernel-nvlink-contention-profiler
version: 1.0.0
description: Profiles GPU tensor core utilization and inter-node NVLink interconnect bandwidth to pinpoint all-reduce communication bottlenecks in LLM training.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - nvlink-bandwidth-profiling
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/gpu-kernel-nvlink-contention-profiler"
